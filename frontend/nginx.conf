server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container
    location /shorten {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    location /stats/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }
}
