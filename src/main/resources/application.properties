# =============================================================
#  URL Shortener — Application Configuration
#  Sensitive values are read from environment variables so that
#  credentials are never committed to source control.
# =============================================================

# ---- Server ----
server.port=8080

# ---- MySQL Datasource ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/urlshortener?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Redis (optional — app degrades gracefully if unavailable) ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis

# ---- Application ----
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.short-code.length=7
app.rate-limit.requests-per-minute=60
